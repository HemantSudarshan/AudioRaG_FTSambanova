# ===================================
# AudioRAG Enterprise - Docker Compose
# ===================================
# Usage: docker-compose up -d

version: '3.8'

services:
  # ===================================
  # Main Application
  # ===================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audiorag-app
    ports:
      - "8501:8501"  # Streamlit
      - "8000:8000"  # FastAPI
    environment:
      - ENVIRONMENT=production
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://audiorag:audiorag@postgres:5432/audiorag
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - LOG_LEVEL=INFO
    volumes:
      - ./hf_cache:/app/hf_cache
      - ./logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - audiorag-network

  # ===================================
  # Background Worker (Celery)
  # ===================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audiorag-worker
    command: celery -A batch.workers worker --loglevel=info
    environment:
      - ENVIRONMENT=production
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://audiorag:audiorag@postgres:5432/audiorag
    volumes:
      - ./hf_cache:/app/hf_cache
      - ./logs:/app/logs
    depends_on:
      - app
      - redis
    restart: unless-stopped
    networks:
      - audiorag-network

  # ===================================
  # Vector Database (Qdrant)
  # ===================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: audiorag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - audiorag-network

  # ===================================
  # Cache (Redis)
  # ===================================
  redis:
    image: redis:7-alpine
    container_name: audiorag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - audiorag-network

  # ===================================
  # Database (PostgreSQL)
  # ===================================
  postgres:
    image: postgres:15-alpine
    container_name: audiorag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: audiorag
      POSTGRES_USER: audiorag
      POSTGRES_PASSWORD: audiorag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiorag -d audiorag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - audiorag-network

  # ===================================
  # Monitoring (Optional)
  # ===================================
  prometheus:
    image: prom/prometheus:latest
    container_name: audiorag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring
    restart: unless-stopped
    networks:
      - audiorag-network

  grafana:
    image: grafana/grafana:latest
    container_name: audiorag-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    profiles:
      - monitoring
    restart: unless-stopped
    networks:
      - audiorag-network

# ===================================
# Volumes
# ===================================
volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ===================================
# Networks
# ===================================
networks:
  audiorag-network:
    driver: bridge
